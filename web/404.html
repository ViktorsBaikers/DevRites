<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — DevRites</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0c1330" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/img/mark-64.png" />
  <link rel="stylesheet" href="/assets/css/fonts.css?v=4" />
  <link rel="stylesheet" href="/assets/css/style.css?v=4" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .nf__code { font-family: var(--font-mono); font-size: clamp(4rem, 14vw, 9rem); font-weight: 700; line-height: 1; letter-spacing: -0.04em; color: var(--accent); }
    .nf h1 { font-size: var(--fs-h2); margin: 0.4rem 0 0.8rem; }
    .nf p { color: var(--ink-muted); margin-bottom: 2rem; }
    .nf__cmd { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--ink-faint); margin-top: 2rem; }
    .nf__cmd .p { color: var(--accent); }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/assets/img/mark-128.png" width="64" height="64" alt="DevRites" style="margin:0 auto 1.5rem" />
      <div class="nf__code" aria-hidden="true">404</div>
      <h1>No spec for this one.</h1>
      <p>That page was never written to disk.</p>
      <a class="btn btn--primary" href="/">Back to the workflow</a>
      <p class="nf__cmd"><span class="p">/rite-status</span> · the active feature is elsewhere</p>
    </div>
  </main>
</body>
</html>
