# Allowlist for the OSV.dev dependency scan (ci.yml validate job +
# scripts/validate.sh). Mirrors scripts/npm-audit-exceptions.json: same owner
# and same expiry via ignoreUntil. The IDs here are a superset of that file
# (its checker rejects exceptions for advisories npm audit does not block on).
# Keep the two files in sync the same day. An unused ignore here is a warning;
# a missing ignore for a live finding is a failure. Prefer pinning a patched ancestor in
# package.json overrides over adding an ignore.

# 2026-09-04: npm@11.19.1 (via @semantic-release/npm override) and
# fast-uri@3.1.6 cleared the previous bundled-npm and fast-uri advisories.
# Leave this file without ignore entries until a new exact, owned,
# expiring exception is required.

# 2026-10-22: ip-address@10.7.2 is bundled inside npm@11.21.1; no npm release
# bundles the patched 10.7.4 yet. Owner: release-maintainers. Mirrors
# scripts/npm-audit-exceptions.json.
[[IgnoredVulns]]
id = "GHSA-rxp7-6hxx-x8q5"
ignoreUntil = 2026-11-29
reason = "ip-address@10.7.2 bundled in npm; only socks parses it for a SOCKS proxy address and the release job sets no proxy. Remove once npm bundles ip-address >=10.7.4."

# Proposed temporary acceptance of npm-bundled undici; owner: release-maintainers.
[[IgnoredVulns]]
id = "GHSA-4qv8-2p9j-2685"
ignoreUntil = 2026-11-07
reason = "undici@6.29.0 is bundled in npm@11.21.1; npm@12.2.1 also bundles 6.29.0, and supported nested overrides plus npm audit fix leave it unchanged after clean install. The bundled copy is imported only by node-gyp header downloads (Agent/fetch); it is not used as EventSource by npm tooling. Remove when npm bundles undici >=6.29.1."

[[IgnoredVulns]]
id = "GHSA-xjj6-f33q-929c"
ignoreUntil = 2026-11-07
reason = "undici@6.29.0 is bundled in npm@11.21.1; npm@12.2.1 also bundles 6.29.0, and supported nested overrides plus npm audit fix leave it unchanged after clean install. The sole bundled importer is node-gyp header-download fetch: crafted response encodings could cause denial of service if that path is invoked. Current release commands do not invoke node-gyp explicitly; this is temporary acceptance of that tooling risk, not proof of unreachability. Remove when npm bundles undici >=6.29.1."

# 2026-10-28: three advisories landed against the undici npm vendors (6.29.0);
# npm@12.2.1, verified from its published tarball, still vendors 6.29.0 even
# though 6.29.1 is patched, and the copy sits inside npm's own package tarball
# where neither an override nor npm audit fix reaches it. Owner:
# release-maintainers. Mirrors scripts/npm-audit-exceptions.json.
[[IgnoredVulns]]
id = "GHSA-2m5v-pch6-74hx"
ignoreUntil = 2026-11-29
reason = "undici@6.29.0 bundled in npm; patched 6.29.1 not yet vendored by any npm release. Reachable only through the node-gyp header-download fetch over TLS to the registry; the bypass needs an active MITM of that connection. Temporary acceptance, not proof of unreachability. Remove when npm bundles undici >=6.29.1."

[[IgnoredVulns]]
id = "GHSA-qrxm-fqhp-jwvm"
ignoreUntil = 2026-11-29
reason = "undici@6.29.0 bundled in npm; patched 6.29.1 not yet vendored by any npm release. Same node-gyp registry-fetch path as GHSA-2m5v-pch6-74hx: TLS 1.2 renegotiation can stall that download; no untrusted peer drives it. Remove when npm bundles undici >=6.29.1."

[[IgnoredVulns]]
id = "GHSA-9fm3-97px-rjf6"
ignoreUntil = 2026-11-29
reason = "undici@6.29.0 bundled in npm; the PONG-buffering path needs the bundled WebSocket client, which no DevRites tooling imports. Remove when npm bundles undici >=6.29.1."

# 2026-10-31: glob and minimatch advisories are inside npm's own tarball.
# npm@12.2.1 (latest; verified from the published tarball) still bundles
# glob@13.0.6 and minimatch@10.2.5. The fixes are glob 14.0.2 and minimatch
# 11.0.1, and npm's own ranges stay ^13.0.6 and ^10.2.5. inBundle copies
# cannot be replaced by an override. npm audit does not report these IDs.
# Owner: release-maintainers. Remove when npm bundles the patched majors.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-11-29
reason = "glob@13.0.6 is bundled in npm@11.21.1; npm@12.2.1's published tarball still bundles 13.0.6, and npm depends on ^13.0.6 so it will not take the fixed 14.0.2. The copy is inBundle, so an override cannot replace it. Advisory is an AbortSignal cancellation bypass that can walk the filesystem after a timeout. Temporary acceptance, not proof of unreachability. Remove when npm bundles glob >=14.0.2."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-29
reason = "minimatch@10.2.5 is bundled in npm@11.21.1; npm@12.2.1's published tarball still bundles 10.2.5, and npm depends on ^10.2.5 so it will not take the fixed 11.0.1. The copy is inBundle, so an override cannot replace it. Advisory is a globparts amplification denial of service. Temporary acceptance, not proof of unreachability. Remove when npm bundles minimatch >=11.0.1."
