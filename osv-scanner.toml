# Allowlist for the OSV.dev dependency scan (ci.yml validate job +
# scripts/validate.sh).
#
# npm@11.21.1 is pinned through @semantic-release/npm, which accepts only
# npm ^11.6.2. That tarball bundles glob, minimatch, undici, and ip-address.
# Overrides cannot replace inBundle copies, and npm@12.2.1 still bundles the
# vulnerable versions. osv-scanner cannot ignore by install path, so these
# package names are ignored wherever they appear. Remove a name from the
# pattern if DevRites takes a direct dependency on it.
#
# scripts/check-npm-audit.mjs applies the narrower rule: an advisory blocks
# when it is installed outside node_modules/npm/node_modules/. Per-advisory
# exceptions in scripts/npm-audit-exceptions.json are only for that case.
# An IgnoredVulns entry must match one of those exceptions, including expiry.

[[PackageOverrides]]
name = "glob|minimatch|undici|ip-address"
nameIsRegex = true
ecosystem = "npm"
vulnerability.ignore = true
reason = "Bundled inside the npm CLI tarball. Not a DevRites dependency. A direct dependency on one of these packages must be removed from this pattern so its advisories block again."
