name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual release / re-run

permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same ref — but only for
# PRs. On main, cancel-in-progress stays false so a push can never abort an
# in-flight release job mid-publish (the old tag-collision/duplicate-release failure mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Validate pack structure
        run: bash scripts/validate.sh

      - name: Frontmatter validator rejects unknown fields
        run: bash tests/validate-frontmatter-rejects-unknown.sh

      - name: Check cross-references (no dead pointers)
        run: python3 scripts/check-cross-refs.py

      - name: Pack security scan (injection + hidden unicode — BLOCKING)
        run: python3 scripts/scan-pack-security.py pack/.claude

      - name: Pack security scanner tests
        run: bash tests/scan-pack-security-test.sh

      - name: Injection-resistance baseline present in agents
        run: bash tests/injection-baseline-present.sh

      - name: Conventions ledger (scorer + store)
        run: bash tests/conventions-ledger-test.sh

      - name: Doctor health diagnose
        run: bash tests/doctor-test.sh

      - name: Workflow security (SHA-pinned actions + scoped permissions — BLOCKING)
        run: python3 scripts/validate-workflow-security.py

      - name: Workflow security validator tests
        run: bash tests/workflow-security-test.sh

      - name: Supply-chain IOC scan (npm lockfile — BLOCKING)
        run: python3 scripts/scan-supply-chain-iocs.py package-lock.json

      - name: Supply-chain IOC scanner tests
        run: bash tests/supply-chain-iocs-test.sh

      - name: Fan-out footprint collector
        run: bash tests/footprint-test.sh

      - name: Validate trigger evals
        run: bash scripts/run-evals.sh

      - name: Validate outcome evals (deterministic grader)
        run: bash scripts/run-outcome-evals.sh

      - name: Validate behavioral evals (shape gate)
        run: bash scripts/run-behavioral-evals.sh

      - name: Behavioral eval validator tests
        run: bash tests/behavioral-evals-test.sh

      - name: Evidence-freshness gate test
        run: bash tests/evidence-fresh-test.sh

      - name: A1 pre-block hook test
        run: bash tests/a1-guard-test.sh

      - name: Anti-slop detector (advisory)
        run: bash scripts/devrites-detect.sh || true

  install-smoke:
    name: install / uninstall smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']   # engines floor + current; brackets the supported range
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: install smoke
        run: bash tests/install-smoke.sh

      - name: cli (npx entry point) smoke
        run: bash tests/cli-smoke.sh

      - name: npx packaged-artifact install smoke
        run: bash tests/npx-pack-smoke.sh

      - name: uninstall smoke
        run: bash tests/uninstall-smoke.sh

      - name: update smoke
        run: bash tests/update-smoke.sh

      - name: fixture install
        run: bash tests/fixture-install.sh

      - name: pack validation script
        run: bash tests/validate-pack.sh

  # Release runs in the same workflow as a final gate — so it (a) shows up as a
  # commit check, and (b) runs on the exact commit CI validated, on the real
  # branch tip, with tags fetched. No workflow_run hand-off, no detached
  # head_sha checkout: the two failure modes that orphaned the v2.1.0 tag and
  # made the release invisible in the checks UI.
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: [validate, install-smoke]
    # Push to main (the chore(release) commit carries [skip ci] so it never
    # re-triggers) or a manual dispatch — never on a PR.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Serial, never cancelled mid-flight — a second push waits, it doesn't abort.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true        # semantic-release needs every release tag to compute the next version
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
