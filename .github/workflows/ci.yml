name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual release / re-run

permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same ref, but only for
# PRs. On main, cancel-in-progress stays false so a push can never abort an
# in-flight release job mid-publish (the old tag-collision/duplicate-release failure mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Validate pack structure
        run: bash scripts/validate.sh

      - name: Check cross-references (no dead pointers)
        run: python3 scripts/check-cross-refs.py

      - name: Check invocation integrity (named skills/rules resolve, both harnesses)
        run: python3 scripts/check-invocation-integrity.py

      - name: "Pack security scan (injection + hidden unicode: BLOCKING)"
        run: python3 scripts/scan-pack-security.py pack/.claude pack/generated

      - name: "Workflow security (SHA-pinned actions + scoped permissions: BLOCKING)"
        run: python3 scripts/validate-workflow-security.py

      - name: "Supply-chain IOC scan (npm lockfile: BLOCKING)"
        run: python3 scripts/scan-supply-chain-iocs.py package-lock.json

      - name: Audit npm dependency advisories (BLOCKING)
        run: npm run audit

      - name: Validate trigger eval schemas
        run: bash scripts/run-evals.sh

      - name: Validate outcome evals (deterministic grader)
        run: bash scripts/run-outcome-evals.sh

      - name: Validate behavioral evals (shape gate)
        run: bash scripts/run-behavioral-evals.sh

      - name: Anti-slop detector (advisory)
        run: bash scripts/devrites-detect.sh || true

  # Build shared host artifacts + engine once; every shard downloads instead of
  # rebuilding locally (saves ~15–30s per shard and warms GOCACHE for lifecycle tests).
  test-prep:
    name: prepare test artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build shared host artifacts
        run: |
          mkdir -p ci-test-artifacts/host
          DEVRITES_HOST_ARTIFACT_DIR="$PWD/ci-test-artifacts/host" bash scripts/build-host-artifacts.sh

      - name: Build shared test engine + warm GOCACHE
        run: |
          mkdir -p ci-test-artifacts/engine ci-test-artifacts/gocache
          version="$(node -p "require('./package.json').version")"
          export GOCACHE="$PWD/ci-test-artifacts/gocache" CGO_ENABLED=0
          # Shared CLI used by most shell tests.
          go build -C engine -trimpath \
            -ldflags "-s -w -X github.com/devrites/devrites/internal/version.Version=v${version}" \
            -o "$PWD/ci-test-artifacts/engine/devrites-engine" .
          # Warm patterns binary-lifecycle / install-lib exercise (unstamped + pinned tags).
          go build -C engine -trimpath -o /tmp/devrites-engine-dev .
          for tag in v9.9.9 v9.9.10 v9.9.11 v9.9.12 v9.9.13; do
            go build -C engine -trimpath \
              -ldflags "-s -w -X github.com/devrites/devrites/internal/version.Version=${tag}" \
              -o /tmp/devrites-engine-warm .
          done

      - name: Upload shared test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devrites-test-artifacts
          path: ci-test-artifacts/
          retention-days: 1

  # Every tests/*.sh through the same runner developers use locally (npm test).
  # run-tests.mjs auto-discovers the suite and supports weighted CI sharding so
  # the slow integration tests (workflow-artifact-identity, binary-lifecycle,
  # install/uninstall smokes) run on separate runners in parallel.
  tests:
    name: shell test suite (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    needs: [validate, test-prep]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download shared test artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: devrites-test-artifacts
          path: ci-test-artifacts

      - name: Restore shared test artifact permissions
        run: chmod +x ci-test-artifacts/engine/devrites-engine

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run shell test shard (tests/*.sh)
        env:
          DEVRITES_TEST_JOBS: '8'
          DEVRITES_WAI_PARALLEL_WORKERS: '4'
          DEVRITES_WAI_BOUNDARY_SHARDS: '4'
          DEVRITES_WAI_CORE_SHARDS: '2'
          DEVRITES_HOST_ARTIFACT_DIR: ${{ github.workspace }}/ci-test-artifacts/host
          DEVRITES_ENGINE_CLI: ${{ github.workspace }}/ci-test-artifacts/engine/devrites-engine
          GOCACHE: ${{ github.workspace }}/ci-test-artifacts/gocache
        run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/8

  engine:
    name: engine (go test + cross-compile)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: gofmt (no diffs)
        working-directory: engine
        run: |
          diff=$(gofmt -l . )
          if [ -n "$diff" ]; then echo "gofmt needed:"; echo "$diff"; exit 1; fi

      - name: go vet
        working-directory: engine
        run: go vet ./...

      - name: Install analysis tools (staticcheck + govulncheck + gosec)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: "staticcheck (static analysis: BLOCKING)"
        working-directory: engine
        run: staticcheck ./...

      - name: "govulncheck (known-CVE scan of the reachable call graph: BLOCKING)"
        working-directory: engine
        run: govulncheck ./...

      # G204/G304 and their taint variants G702/G703 are excluded: this is a project-local
      # CLI that by design execs git/go and reads paths the operator passes in, so every
      # subprocess argument and file path is "tainted". Permission expectations for the
      # files the engine writes (0644 files / 0755 dirs+binaries) live in .gosec.json.
      - name: "gosec (security static analysis: BLOCKING)"
        working-directory: engine
        run: gosec -conf .gosec.json -exclude=G204,G304,G702,G703 ./...

      - name: go test -race (control plane + parity oracle)
        working-directory: engine
        run: go test ./... -race -count=1

      - name: Cross-compile matrix smoke (all release targets build)
        run: bash scripts/build-binaries.sh 0.0.0-ci

      # Same script semantic-release's prepare step runs: prove the release
      # tarball (+ sha256 sidecar) builds BEFORE publish time, not during it.
      - name: Release tarball smoke (build + checksum present)
        run: |
          bash scripts/build-release-tarball.sh 0.0.0-ci
          test -f dist/devrites-v0.0.0-ci.tar.gz.sha256 || {
            echo "release tarball checksum sidecar missing" >&2
            exit 1
          }

  # DevRites ships a Windows engine binary; run the Go tests where path
  # separators, file locking, and %USERPROFILE% semantics differ.
  # Ubuntu stays the full strict gate (staticcheck/govulncheck/gosec/-race);
  # this job only proves the binary logic on Windows.
  engine-windows:
    name: engine (go test, windows)
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: go test (path / root / workspace / ledger behavior)
        working-directory: engine
        run: go test ./... -count=1

  # Release runs in the same workflow as a final gate, so it (a) shows up as a
  # commit check, and (b) runs on the exact commit CI validated, on the real
  # branch tip, with tags fetched. No workflow_run hand-off, no detached
  # head_sha checkout: the two failure modes that orphaned the v2.1.0 tag and
  # made the release invisible in the checks UI.
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: [validate, tests, engine, engine-windows]
    # Push to main (the chore(release) commit carries [skip ci] so it never
    # re-triggers) or a manual dispatch: never on a PR.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Serial, never cancelled mid-flight: a second push waits, it doesn't abort.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true        # semantic-release needs every release tag to compute the next version
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      # prepack (npm publish path) regenerates pack/generated via
      # scripts/build-host-artifacts.sh, which needs python3 on PATH.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      # semantic-release's prepare step cross-compiles the engine binary matrix
      # (scripts/build-binaries.sh): pure-Go, CGO_ENABLED=0, so one Linux runner
      # produces every target (darwin/linux/windows × amd64/arm64) with no
      # cross-toolchain. The binaries + sha256 sidecars are attached to the Release.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
