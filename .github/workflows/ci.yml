name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Validate pack structure
        run: bash scripts/validate.sh

      - name: Frontmatter validator rejects unknown fields
        run: bash tests/validate-frontmatter-rejects-unknown.sh

      - name: Check cross-references (no dead pointers)
        run: python3 scripts/check-cross-refs.py

      - name: Pack security scan (injection + hidden unicode — BLOCKING)
        run: python3 scripts/scan-pack-security.py pack/.claude

      - name: Pack security scanner tests
        run: bash tests/scan-pack-security-test.sh

      - name: Injection-resistance baseline present in agents
        run: bash tests/injection-baseline-present.sh

      - name: Conventions ledger (scorer + store)
        run: bash tests/conventions-ledger-test.sh

      - name: Validate trigger evals
        run: bash scripts/run-evals.sh

      - name: Validate outcome evals (deterministic grader)
        run: bash scripts/run-outcome-evals.sh

      - name: Evidence-freshness gate test
        run: bash tests/evidence-fresh-test.sh

      - name: A1 pre-block hook test
        run: bash tests/a1-guard-test.sh

      - name: Anti-slop detector (advisory)
        run: bash scripts/devrites-detect.sh || true

  install-smoke:
    name: install / uninstall smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install smoke
        run: bash tests/install-smoke.sh

      - name: uninstall smoke
        run: bash tests/uninstall-smoke.sh

      - name: update smoke
        run: bash tests/update-smoke.sh

      - name: fixture install
        run: bash tests/fixture-install.sh

      - name: pack validation script
        run: bash tests/validate-pack.sh
