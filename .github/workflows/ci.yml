name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Inert until a merge queue is enabled on the repo; when enabled, the
  # workflow runs on the queue's checks_requested event with the same
  # scoping (detect-changes sees a non-PR event and runs the full matrix).
  merge_group:
  workflow_dispatch:        # manual release / re-run

permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same ref, but only for
# PRs. On main, cancel-in-progress stays false so a push can never abort an
# in-flight release job mid-publish (the old tag-collision/duplicate-release failure mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_engine: ${{ steps.scope.outputs.run_engine }}
      run_pack_evals: ${{ steps.scope.outputs.run_pack_evals }}
      run_full: ${{ steps.scope.outputs.run_full }}
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: bash scripts/ci-change-scope.sh

  validate:
    name: validate pack
    needs: detect-changes
    # Docs-only PRs (README/CHANGELOG/LICENSE/docs//.scratch/ exclusively)
    # skip the pack validators; the job-level skip still reports success for
    # required checks.
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Shallow: validate.sh only needs rev-parse/ls-files; no job here reads
        # history or tags (the identity test stays tag-blind on PRs by design).
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          # Tool installs only; engine job owns the shared build cache snapshot.
          cache: false

      - name: Install workflow linters + osv-scanner
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          python3 -m pip install --disable-pip-version-check zizmor
          command -v actionlint
          command -v osv-scanner
          command -v zizmor

      - name: Validate pack structure
        run: bash scripts/validate.sh

      - name: Check cross-references (no dead pointers)
        run: python3 scripts/check-cross-refs.py

      - name: Check invocation integrity (named skills/rules resolve, both harnesses)
        run: python3 scripts/check-invocation-integrity.py

      - name: "Pack security scan (injection + hidden unicode: BLOCKING)"
        run: python3 scripts/scan-pack-security.py pack/.claude pack/generated

      - name: "Workflow security (SHA-pinned actions + scoped permissions: BLOCKING)"
        run: python3 scripts/validate-workflow-security.py

      - name: "Supply-chain IOC scan (npm lockfile: BLOCKING)"
        run: python3 scripts/scan-supply-chain-iocs.py package-lock.json

      - name: Audit npm dependency advisories (BLOCKING)
        run: npm run audit

      # OSV.dev data source: broader than the npm advisory DB npm audit uses,
      # and covers the engine module. Allowlist lives in osv-scanner.toml and
      # mirrors scripts/npm-audit-exceptions.json policy.
      - name: "OSV.dev dependency scan (lockfile + engine module: BLOCKING)"
        run: osv-scanner scan --config osv-scanner.toml --lockfile package-lock.json --lockfile engine/go.mod

      - name: Validate trigger eval schemas
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_pack_evals == 'true'
        run: bash scripts/run-evals.sh

      - name: Validate outcome evals (deterministic grader)
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_pack_evals == 'true'
        run: bash scripts/run-outcome-evals.sh

      - name: Validate behavioral evals (shape gate)
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_pack_evals == 'true'
        run: bash scripts/run-behavioral-evals.sh

      - name: Eval coverage ledger (gating skills + P0 agents)
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_pack_evals == 'true'
        run: bash scripts/check-gating-eval-ledger.sh

      - name: Anti-slop detector (advisory)
        run: bash scripts/devrites-detect.sh || true

  # Every tests/*.sh through the same runner developers use locally (npm test).
  # run-tests.mjs auto-discovers the suite, supports weighted CI sharding so
  # the slow integration tests (workflow-artifact-identity, binary-lifecycle,
  # install/uninstall smokes) run on separate runners in parallel, and
  # self-provisions the host artifacts + engine CLI. The setup-go cache
  # (keyed on engine/go.mod + ci.yml) keeps those builds warm across runs;
  # the engine job primes the version-stamp patterns into the same snapshot.
  tests:
    name: shell test suite (shard ${{ matrix.shard }}/8)
    needs: detect-changes
    # Docs-only skip via run_full; engine-only PRs skip shards via run_tests
    # (validate still runs). Job-level skip reports success for required checks.
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # Independent of validate and test-prep: every check still runs and gates
    # the PR, but nothing serializes ahead of the suites.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          # Restore-only (engine job owns the save); keeps this job's inline
          # engine build and the stamp builds warm.
          cache: false

      - name: Restore Go build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: engine-go-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            engine-go-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run shell test shard (tests/*.sh)
        env:
          DEVRITES_TEST_JOBS: '8'
          DEVRITES_WAI_PARALLEL_WORKERS: '4'
          DEVRITES_WAI_BOUNDARY_SHARDS: '6'
          DEVRITES_WAI_CORE_SHARDS: '4'
        run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/8

  engine:
    name: engine (go test + cross-compile)
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          # This job owns the shared Go snapshot (see restore below): setup-go's
          # auto-save would let a thin shard snapshot clobber it, so caching is
          # handled explicitly.
          cache: false

      # Fat snapshot (build cache + modules incl. analysis tools + stamps).
      # Unique key per commit => re-saved every run; restore-keys fall back to
      # the newest earlier snapshot.
      - name: Restore Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: engine-go-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            engine-go-${{ runner.os }}-${{ runner.arch }}-

      - name: gofmt (no diffs)
        working-directory: engine
        run: |
          diff=$(gofmt -l . )
          if [ -n "$diff" ]; then echo "gofmt needed:"; echo "$diff"; exit 1; fi

      - name: go vet
        working-directory: engine
        run: go vet ./...

      - name: Install analysis tools (staticcheck + govulncheck + gosec + golangci-lint)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: "staticcheck (static analysis: BLOCKING)"
        working-directory: engine
        run: staticcheck ./...

      - name: "govulncheck (known-CVE scan of the reachable call graph: BLOCKING)"
        working-directory: engine
        run: govulncheck ./...

      # No rule-class exclusions: every G204/G304/G702/G703 site carries a
      # per-call `// #nosec GXXX -- <justification>` in the source instead, so a
      # genuinely new injection or traversal sink fails this gate. Permission
      # expectations for the files the engine writes (0644 files / 0755
      # dirs+binaries) live in .gosec.json.
      - name: "gosec (security static analysis: BLOCKING)"
        working-directory: engine
        run: gosec -conf .gosec.json ./...

      # Curated complement to staticcheck (errcheck + ineffassign; .golangci.yml).
      - name: "golangci-lint (unchecked errors + dead assignments: BLOCKING)"
        working-directory: engine
        run: golangci-lint run ./...

      - name: go test -race -shuffle=on (control plane + parity oracle)
        working-directory: engine
        run: go test ./... -race -shuffle=on -count=1

      # Prime the version-stamp builds the shard tests exercise (unstamped +
      # pinned tags) into the shared Go build cache this job saves; keeps the
      # shards from cold-building them every run.
      - name: Prime shared stamp builds
        run: |
          CGO_ENABLED=0 go build -C engine -trimpath -o /tmp/devrites-engine-dev .
          for tag in v9.9.9 v9.9.10 v9.9.11 v9.9.12 v9.9.13; do
            CGO_ENABLED=0 go build -C engine -trimpath \
              -ldflags "-s -w -X github.com/devrites/devrites/internal/version.Version=${tag}" \
              -o /tmp/devrites-engine-warm .
          done

      - name: Cross-compile matrix smoke (all release targets build)
        run: bash scripts/build-binaries.sh 0.0.0-ci

      - name: Verify release binary checksum sidecars
        run: |
          shopt -s nullglob
          for bin in dist/bin/devrites-*; do
            [[ "$bin" == *.sha256 ]] && continue
            sidecar="${bin}.sha256"
            test -f "$sidecar" || { echo "missing checksum sidecar for $bin" >&2; exit 1; }
            ( cd dist/bin && shasum -a 256 -c "$(basename "$sidecar")" )
          done

      # Same script semantic-release's prepare step runs: prove the release
      # tarball (+ sha256 sidecar) builds BEFORE publish time, not during it.
      - name: Release tarball smoke (build + checksum present)
        run: |
          bash scripts/build-release-tarball.sh 0.0.0-ci
          test -f dist/devrites-v0.0.0-ci.tar.gz.sha256 || {
            echo "release tarball checksum sidecar missing" >&2
            exit 1
          }

  # DevRites ships a Windows engine binary; run the Go tests where path
  # separators, file locking, and %USERPROFILE% semantics differ.
  # Ubuntu and macOS run the strict gate (staticcheck/govulncheck/gosec/-race
  # on Ubuntu; -race on macOS); this job only proves the binary logic on
  # Windows, where the race detector is historically flaky under load.
  engine-windows:
    name: engine (go test, windows)
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_engine == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.mod
            .github/workflows/ci.yml

      - name: go test (path / root / workspace / ledger behavior)
        working-directory: engine
        run: go test ./... -shuffle=on -count=1

  engine-macos:
    name: engine (go test, macos)
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_engine == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.mod
            .github/workflows/ci.yml

      - name: go test -race (darwin path semantics + race detector)
        working-directory: engine
        run: go test ./... -race -shuffle=on -count=1

  # The release matrix ships linux/arm64; run the suite natively on a free
  # arm64 hosted runner instead of trusting the cross-compile smoke alone.
  engine-linux-arm:
    name: engine (go test, linux arm64)
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.run_engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.mod
            .github/workflows/ci.yml

      - name: go test -race (arm64 path semantics + race detector)
        working-directory: engine
        run: go test ./... -race -shuffle=on -count=1

  # Release runs in the same workflow as a final gate, so it (a) shows up as a
  # commit check, and (b) runs on the exact commit CI validated, on the real
  # branch tip, with tags fetched. No workflow_run hand-off, no detached
  # head_sha checkout: the two failure modes that orphaned the v2.1.0 tag and
  # made the release invisible in the checks UI.
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: [detect-changes, validate, tests, engine, engine-windows, engine-macos, engine-linux-arm]
    timeout-minutes: 60
    # Push to main (the chore(release) commit carries [skip ci] so it never
    # re-triggers) or a manual dispatch: never on a PR.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    # Serial, never cancelled mid-flight: a second push waits, it doesn't abort.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true        # semantic-release needs every release tag to compute the next version
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Trusted publishing: do not restore a shared npm cache into the
          # publish job (cache poisoning was a 2026 npm incident path).
          cache: false

      # prepack (npm publish path) regenerates pack/generated via
      # scripts/build-host-artifacts.sh, which needs python3 on PATH.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      # semantic-release's prepare step cross-compiles the engine binary matrix
      # (scripts/build-binaries.sh): pure-Go, CGO_ENABLED=0, so one Linux runner
      # produces every target (darwin/linux/windows × amd64/arm64) with no
      # cross-toolchain. The binaries + sha256 sidecars are attached to the Release.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      # Build provenance for every release artifact, independent of npm
      # provenance: 2026's TanStack/Miasma waves shipped malicious packages
      # carrying valid SLSA provenance, so consumers verify this attestation
      # (gh attestation verify, see docs/release.md) against the artifact
      # digest, not against the npm publish record.
      - name: Attest release artifacts
        if: hashFiles('dist/bin/*') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/bin/devrites-*
            dist/devrites-v*.tar.gz
            dist/install.sh

      # CycloneDX SBOMs for the npm package and the shipped linux/amd64
      # engine binary. Attached to the GitHub Release when semantic-release
      # published one for this exact HEAD (git describe --exact-match).
      - name: Generate npm SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > dist/devrites-npm.cdx.json

      - name: Generate engine binary SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          artifact: dist/bin/devrites-linux-amd64
          output-file: dist/devrites-engine-linux-amd64.cdx.json
          upload-artifact: false

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            TAG="$(git describe --exact-match --tags HEAD)"
            gh release upload "$TAG" dist/devrites-npm.cdx.json dist/devrites-engine-linux-amd64.cdx.json --clobber
            echo "SBOMs attached to ${TAG}"
          else
            echo "HEAD is not a release tag; no release this run — SBOMs not attached"
          fi
