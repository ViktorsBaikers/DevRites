name: dependabot-auto-merge

# Dependabot cannot push straight to main. Approve the PR and enable
# auto-merge; GitHub squashes once required checks are green. Subjects are
# ci(no-release), so semantic-release does not publish. dependabot.yml still
# waits 7 days before proposing a freshly published version.

on:
  # Dependabot-triggered pull_request workflows receive a read-only token.
  # This workflow never checks out or executes PR code, so pull_request_target
  # is safe here and gives the metadata/gh steps the declared write scopes.
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# A fresh Dependabot push cancels the stale auto-merge attempt; the next
# event re-runs it. Nothing here is mid-flight-unsafe (approve/merge only).
concurrency:
  # pull_request_target sets github.ref to the base branch, so key on the PR
  # number or every Dependabot PR would cancel the others.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Approve and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # A re-run already has this bot's approval. Do not block the merge on that.
          gh pr review --approve "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL"
