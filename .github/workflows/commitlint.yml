name: commitlint

# PR-only by design: commit messages and the PR title (the squash subject that
# drives semantic-release) are linted when a PR is opened/edited/updated,
# never on push to main (semantic-release's own `chore(release):` commits and
# already-merged history must not be re-linted).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Cancel an in-flight run when the PR gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Lint commit messages and PR title
        id: lint
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          OUT="$(npx --no-install commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to   "${{ github.event.pull_request.head.sha }}" \
            --verbose 2>&1)"
          STATUS=$?
          TITLE_OUT="$(printf '%s\n' "$TITLE" | npx --no-install commitlint --verbose 2>&1)"
          TITLE_STATUS=$?
          OUT="$(printf '%s\n\nPR title:\n%s' "$OUT" "$TITLE_OUT")"
          if [ "$TITLE_STATUS" -ne 0 ]; then STATUS=$TITLE_STATUS; fi
          printf '%s\n' "$OUT"
          {
            echo 'output<<COMMITLINT_EOF'
            printf '%s\n' "$OUT"
            echo 'COMMITLINT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sticky comment body
        id: body
        if: always()
        env:
          LINT_OUTPUT: ${{ steps.lint.outputs.output }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The echo lines below are intentional literal content (backticks,
          # $-forms) rendered into the PR comment; no expansion is wanted.
          # shellcheck disable=SC2016
          {
            echo 'body<<COMMENT_EOF'
            if [ "$LINT_STATUS" = "0" ]; then
              echo '### commitlint: all commits and the PR title valid'
              echo ''
              echo 'Every commit and the PR title match the DevRites Conventional Commit policy.'
            else
              echo '### commitlint: one or more commits or the PR title need a rewrite'
              echo ''
              echo 'Raw output:'
              echo ''
              echo '```'
              printf '%s\n' "$LINT_OUTPUT"
              echo '```'
              echo ''
              echo '#### Suggested format'
              echo ''
              echo '```'
              echo 'type(scope): subject'
              echo ''
              echo '<optional body, wrapped at 100 chars>'
              echo '```'
              echo ''
              echo '- `type` ∈ feat, fix, remove, docs, style, refactor, perf, test, build, ci, chore, revert'
              echo '- `scope` ∈ skills, rite, devrites, agents, rules, installer, uninstall, scripts, docs, tests, deps, deps-dev, release, repo, ci, no-release, readme'
              echo '- `subject` imperative, lower-case, no trailing period; header 12-72 chars'
              echo '- body lines ≤ 100 chars, leading blank line'
              echo ''
              echo '#### Rewrite locally'
              echo ''
              echo '```bash'
              echo '# most recent commit'
              echo 'git commit --amend'
              echo ''
              echo '# older commits in this PR'
              echo "git rebase -i origin/${BASE_REF}"
              echo ''
              echo '# then'
              echo 'git push --force-with-lease'
              echo ''
              echo '# PR title: edit it on the PR page (it becomes the squash subject)'
              echo '```'
            fi
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post / update sticky PR comment
        if: always()
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: commitlint
          message: ${{ steps.body.outputs.body }}

      - name: Fail job if lint failed
        if: steps.lint.outputs.status != '0'
        run: |
          echo "commitlint failed: see PR comment for details" >&2
          exit 1
