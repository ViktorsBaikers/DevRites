name: evals

# Every evaluation in this workflow is deterministic, network-free, and free to
# run. DevRites does not accept model credentials or provide paid evaluation
# jobs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  deterministic-contracts:
    name: deterministic agent and behavioral contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run the 24-cell fake agent-contract matrix
        run: >-
          python3 scripts/run-agent-contract-evals.py
          --fake
          --results-dir "$RUNNER_TEMP/agent-contract"

      - name: Check the frozen behavioral trial
        run: >-
          python3 scripts/run-live-behavioral-evals.py
          --dry-run
          --results-dir "$RUNNER_TEMP/behavioral-dry"

      - name: Run the 20-cell fake behavioral trial
        run: >-
          python3 scripts/run-live-behavioral-evals.py
          --fake
          --results-dir "$RUNNER_TEMP/behavioral-fake"

      - name: Upload metadata-only summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deterministic-eval-summaries
          path: |
            ${{ runner.temp }}/agent-contract/summary.json
            ${{ runner.temp }}/behavioral-dry/summary.json
            ${{ runner.temp }}/behavioral-fake/summary.json
          if-no-files-found: ignore
          retention-days: 14
