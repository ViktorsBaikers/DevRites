name: engine-fuzz

# Bounded Go native fuzzing. Not a required check: PR `go test ./...` already
# executes fuzz targets against their seed corpus. This job explores for 20s
# per named fuzz function on a schedule.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: go test -fuzz (20s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod

      - name: Fuzz safepath, markdowntext, and state parsers
        working-directory: engine
        run: |
          set -euo pipefail
          go test ./internal/safepath -fuzz=FuzzWithinResolved -fuzztime=20s
          go test ./internal/safepath -fuzz=FuzzResolveExisting -fuzztime=20s
          go test ./internal/markdowntext -fuzz=FuzzStructural -fuzztime=20s
          go test ./internal/state -fuzz=FuzzCursorRoundTrip -fuzztime=20s
          go test ./internal/state -fuzz=FuzzCursorParsing -fuzztime=20s
          go test ./internal/state -fuzz=FuzzWorkspaceSchemaRow -fuzztime=20s
          go test ./internal/state -fuzz=FuzzTaskGraphParsing -fuzztime=20s
          go test ./internal/parallel -fuzz=FuzzPathDisjoint -fuzztime=20s
