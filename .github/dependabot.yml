version: 2

updates:
  # JS toolchain: husky, commitlint, semantic-release plugins, etc.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # Release-age cooldown: freshly published versions (the Shai-Hulud 2025-2026
    # propagation window) wait a week before Dependabot proposes them.
    cooldown:
      default-days: 7
    # Scope is always no-release. include: scope would append (deps) or
    # (deps-dev) and the header would not parse. ci does not publish, and
    # the no-release scope is what semantic-release matches.
    commit-message:
      prefix: "ci(no-release)"
      prefix-development: "ci(no-release)"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      # Collapse all routine patch + minor bumps into a single weekly PR.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Security updates ship together as soon as Dependabot detects them.
      npm-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
    # Majors stay ungrouped so a failing major does not block the patch group.
    # Auto-merge still merges a major when that PR's checks are green.

  # GitHub Actions used across .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # Same release-age cooldown as the npm ecosystem.
    cooldown:
      default-days: 7
    # Same no-release subject as npm. Actions updates are production deps,
    # so prefix (not prefix-development) is what Dependabot uses.
    commit-message:
      prefix: "ci(no-release)"
      prefix-development: "ci(no-release)"
    labels:
      - "dependencies"
      - "automerge"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
